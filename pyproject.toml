[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rivaldefs"
version = "0.1.0"
description = "Direction and implementation robustness of disagreement between rival binary labeling rules"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Elliot Tower" }]
keywords = ["agreement", "case definitions", "nestedness", "loevinger h",
            "multiverse", "reproducibility"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["numpy>=1.24"]

[tool.hatch.build.targets.wheel]
packages = ["src/rivaldefs"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/elliottower/rivaldefs"
